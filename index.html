<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KINA RADAR</title><style>body{font-family:-apple-system,sans-serif;background:#0b0d12;color:#fff;margin:0}main{max-width:1000px;margin:auto;padding:28px}.panel{background:#141820;border:1px solid #29303b;border-radius:18px;padding:18px;margin-top:18px}button,a{background:#202631;color:#fff;border:1px solid #384150;border-radius:999px;padding:10px 14px;text-decoration:none}.spotify{background:#176b42}.track{display:grid;grid-template-columns:45px 1fr auto;padding:13px 0;border-top:1px solid #29303b}.muted{color:#9aa5b4}</style></head><body><main><h1>🎧 KINA RADAR</h1><p class="muted">BE • NL • FR muziek radar</p><a class="spotify" href="/.netlify/functions/spotify-login">Koppel Spotify</a> <button onclick="load()">Vernieuw</button><div class="panel"><div id="spotify">Spotify controleren…</div><div id="status" class="muted">Radar laden…</div></div><div class="panel" id="list"></div></main><script>async function load(){try{let r=await fetch("/.netlify/functions/radar",{cache:"no-store"}),d=await r.json();status.textContent="Radar online • "+new Date(d.updated).toLocaleString("nl-BE");list.innerHTML=d.tracks.map((t,i)=>`<div class="track"><b>${i+1}</b><div><b>${t.title}</b><div class="muted">${t.artist} • ${t.countries.join(" / ")}</div></div><b>${t.score}</b></div>`).join("")}catch(e){status.textContent="Backendfout: "+e.message}try{let r=await fetch("/.netlify/functions/spotify-status",{cache:"no-store"}),d=await r.json();spotify.textContent=d.connected?"Spotify gekoppeld ✓ • "+d.display_name:"Spotify nog niet gekoppeld"}catch(e){spotify.textContent="Spotify-status niet beschikbaar"}}load()</script></body></html>
